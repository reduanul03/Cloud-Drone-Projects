<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Login Page</title>
    <link rel="stylesheet" href="account.css">
</head>
<body>
    <div class="login-container">
        <form class="login-form">
            <h2>
            Create An Account</h2>
            <p>Cloud Drone</p>
            
            <div class="input-group">
                <label for="text">First Name</label>
                <input type="text" id="text" placeholder="Enter your First Name" required>
            </div>
            <div class="input-group">
                <label for="text">Last Name</label>
                <input type="text" id="text" placeholder="Enter your Last Name" required>
            </div>
            <div class="input-group">
                <label for="email">Email or phone number</label>
                <input type="email" id="email" placeholder="Enter your email or phone number" required>
            </div>
            <div class="input-group">
                <label for="password">Create Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            
            <a href="#"><button type="submit" class="login-btn">Submit</button></a>
            
            <div class="bottom-text">
             <a href="account.html">Log in</a></p>
            </div>
        </form>
    </div>
</body>
</html>
